# Walking skeleton (HE-16): web UI, backend and MQTT broker.
# Start with: docker compose up --build   then open http://localhost:3000
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # Fleet simulator (HE-50): publishes the telemetry of 30 scooters and answers unlock commands.
  # Parameters (Product Specification 4.3) can be overridden here, e.g. SIMULATOR_TELEMETRYINTERVAL: 1s
  simulator:
    build: ./simulator
    environment:
      SIMULATOR_MQTT_BROKERURL: tcp://mosquitto:1883
    depends_on:
      - mosquitto
    # The broker may take a moment to accept connections: retry until it does.
    restart: on-failure

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
