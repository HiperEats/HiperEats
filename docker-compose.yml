# Walking skeleton (HE-16): web UI, backend and MQTT broker.
# Start with: docker compose up --build   then open http://localhost:3000
services:
  backend:
    build: ./backend
    environment:
      # Telemetry adapter (HE-51): broker that carries the scooters' telemetry.
      HIPEREATS_TELEMETRY_BROKERURL: tcp://mosquitto:1883
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
