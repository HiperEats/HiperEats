version: 2
updates:
  # Pull requests go to dev, as every other change (without target-branch they go to main).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Uncomment once each subproject has its build file
  # - package-ecosystem: "maven"
