name: CI

# Build and test every part of the project on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unit tests (*Test, Surefire), integration tests (*IT, Failsafe) and packaging.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/cucumber/
          if-no-files-found: ignore

  simulator:
    name: Simulator (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: simulator/pom.xml

      # Unit tests (*Test, Surefire) and integration tests with Mosquitto in Testcontainers (*IT, Failsafe).
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-test-reports
          path: |
            simulator/target/surefire-reports/
            simulator/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  dependencies:
    name: Dependencies (vulnerability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Practice Q3: dependency vulnerability scanning on every build. Trivy scans the Maven
    # dependencies of the backend and the simulator, and the npm dependencies of the frontend.
    # - npm: development dependencies are included too (TRIVY_INCLUDE_DEV_DEPS, npm only).
    # - Maven: Trivy covers the compile and runtime scopes only, not test, provided or optional
    #   (Testcontainers, Cucumber...); Dependabot opens their update pull requests, and its
    #   alerts (repository settings) report their known vulnerabilities.
    # - The base images of the Dockerfiles and of docker-compose.yml are not scanned at all.
    # Trivy reads the Maven dependencies from the local repository only (TRIVY_OFFLINE_SCAN):
    # without it, it downloads every POM from Maven Central, which rate-limits CI (HTTP 429) and
    # would fail the job without any vulnerability.
    env:
      TRIVY_INCLUDE_DEV_DEPS: "true"
      TRIVY_OFFLINE_SCAN: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            simulator/pom.xml

      # Puts the dependencies of both Maven projects in ~/.m2 (cached), where Trivy reads them.
      - name: Resolve Maven dependencies
        run: |
          (cd backend && ./mvnw -B -ntp -q dependency:resolve)
          (cd simulator && ./mvnw -B -ntp -q dependency:resolve)

      # The action is pinned to a full commit SHA, not a tag: in March 2026 most trivy-action tags
      # were rewritten to point to malware (GHSA-69fq-xp46-6x23). v0.36.0 is an immutable release
      # published after the incident. Dependabot updates the SHA; the Trivy version below is
      # updated by hand.
      - name: List HIGH and CRITICAL vulnerabilities (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          skip-dirs: .cache
          exit-code: "0"

      # Fails the build only when a HIGH or CRITICAL vulnerability already has a fixed version:
      # then updating the dependency fixes it. Vulnerabilities with no fix yet stay in the report
      # above without blocking every merge. Reuses the Trivy, database and ~/.m2 of the steps
      # above, so this second scan is local; cache is off here so that restoring the database
      # cache again does not replace the one the first step just updated. (trivy convert cannot
      # apply --ignore-unfixed to a saved report, hence two scans.)
      - name: Fail on fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: "false"
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          skip-dirs: .cache
          ignore-unfixed: true
          exit-code: "1"
