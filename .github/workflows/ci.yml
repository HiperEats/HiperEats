        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          skip-dirs: .cache
          exit-code: "0"

      # Fails the build only when a HIGH or CRITICAL vulnerability already has a fixed version:
      # then updating the dependency fixes it. Vulnerabilities with no fix yet stay in the report
      # above without blocking every merge. Reuses the Trivy, database and ~/.m2 of the steps
      # above, so this second scan is local; cache is off here so that restoring the database
      # cache again does not replace the one the first step just updated. (trivy convert cannot
      # apply --ignore-unfixed to a saved report, hence two scans.)
      - name: Fail on fixable HIGH and CRITICAL vulnerabilities
