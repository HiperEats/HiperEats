name: CI

# Build and test every part of the project on every pull request and on every push to dev and
# main, and analyse the backend with SonarCloud on the same events. Feature branches run CI in
# their pull request only, so each commit of a pull request runs once.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Unit tests (*Test, Surefire), integration tests (*IT, Failsafe) and packaging. A failing
      # test does not stop Maven here, so that every test runs and every report exists (Xray gets
      # all the results, HE-41); the step "Fail when a test failed" fails the job afterwards.
      - name: Build and test
        run: ./mvnw -B -ntp verify -Dmaven.test.failure.ignore=true

      # Compiled classes, test results and coverage, so that SonarCloud does not build and test again.
      # Same condition as the quality-gate job: a manual run on another branch has no analysis to feed.
      - name: Upload build for SonarCloud
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: backend-sonar
          path: |
            backend/target/classes/
            backend/target/test-classes/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/cucumber/
            backend/target/xray/
          if-no-files-found: ignore

      # Fails the job, and so this required check, when a unit, integration or acceptance test
      # failed: "Build and test" lets Maven go on after a failing test.
      - name: Fail when a test failed
        run: |
          failed=$(grep -lE '<testsuite [^>]*(failures|errors)="[1-9]' \
            target/surefire-reports/TEST-*.xml target/failsafe-reports/TEST-*.xml || true)
          if [ -n "$failed" ]; then
            echo "::error::Tests failed in: $(xargs -n1 basename <<< "$failed" | tr '\n' ' ')"
            exit 1
          fi
          if ! ls target/surefire-reports/TEST-*.xml target/failsafe-reports/TEST-*.xml > /dev/null; then
            echo "::error::Test reports are missing"
            exit 1
          fi

  simulator:
    name: Simulator (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: simulator/pom.xml

      # Unit tests (*Test, Surefire) and integration tests with Mosquitto in Testcontainers (*IT, Failsafe).
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-test-reports
          path: |
            simulator/target/surefire-reports/
            simulator/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The ruleset of dev and main requires "Quality gate (SonarCloud)". Only pull request runs have
  # that name: the push run of a merge to dev or main must never report a result under the required
  # name. A feature branch is analysed once, in its pull request. dev and main are analysed on push
  # because SonarCloud compares each pull request with the last analysis of its target branch.
  quality-gate:
    name: ${{ github.event_name == 'pull_request' && 'Quality gate (SonarCloud)' || 'SonarCloud analysis of the branch' }}
    needs: backend
    # !cancelled(): without it a failing backend job skips this job, and a skipped job counts as
    # passed on a required check. The first step fails it instead.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub gives no secrets to pull requests from Dependabot or from forks. Without this they
      # would fail for good on a required check; the push to dev analyses them after the merge.
      HAS_SECRETS: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Fail when the backend job did not pass
        if: needs.backend.result != 'success'
        run: |
          echo "::error::The backend job did not pass (${{ needs.backend.result }}), so there is no build to analyse."
          exit 1

      - name: Explain the skipped analysis
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::SonarCloud analysis skipped, GitHub gives no secrets to this pull request."

      - uses: actions/checkout@v7
        if: env.HAS_SECRETS == 'true'
        with:
          # SonarCloud needs the history to find the new code.
          fetch-depth: 0

      - name: Set up Java 21
        if: env.HAS_SECRETS == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Download the backend build
        if: env.HAS_SECRETS == 'true'
        uses: actions/download-artifact@v8
        with:
          name: backend-sonar
          path: backend/target

      # The analyzers SonarCloud downloads; the Maven cache of the backend job does not keep them.
      - name: Cache the SonarCloud analyzers
        if: env.HAS_SECRETS == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # In a pull request, waits for the quality gate (up to 5 minutes) and fails when it fails.
      # Not on dev and main: the gate of a branch is not computed in its first analysis.
      - name: SonarCloud analysis and quality gate
        if: env.HAS_SECRETS == 'true'
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          : "${SONAR_TOKEN:?The SONAR_TOKEN secret is missing}"
          ./mvnw -B -ntp sonar:sonar -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

  # Xray traceability (HE-41): the backend tests linked to a story (@Requirement, or the @HE-n tag
  # of a Gherkin feature) become one Test Execution in Xray, in the Test Plan of the current
  # iteration. Tests that do not exist in Xray yet are created and linked to their story; tests
  # linked to no story stay in the CI reports only.
  # Only on dev, on every push and when started by hand (Run workflow): what is merged is what
  # counts, and pull requests from Dependabot or forks get no secrets. Runs also when tests failed,
  # so that Xray shows the failures.
  xray:
    name: Xray test results
    needs: backend
    if: ${{ !cancelled() && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the test reports
        uses: actions/download-artifact@v8
        with:
          name: backend-test-reports
          path: reports

      - name: Keep the tests linked to a story
        id: report
        # On its own line, so that a failing script fails the step.
        run: |
          count=$(python3 .github/scripts/xray-report.py reports/xray xray-report.xml)
          echo "tests=$count" >> "$GITHUB_OUTPUT"

      # XRAY_TEST_PLAN_KEY is a repository variable (Settings, Secrets and variables, Actions,
      # Variables): the Test Plan of the current iteration, changed once per iteration.
      - name: Import the results into Xray
        if: steps.report.outputs.tests != '0'
        env:
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          TEST_PLAN_KEY: ${{ vars.XRAY_TEST_PLAN_KEY }}
          XRAY_API: https://xray.cloud.getxray.app/api/v2
        run: |
          set -o pipefail
          : "${XRAY_CLIENT_ID:?The XRAY_CLIENT_ID secret is missing}"
          : "${XRAY_CLIENT_SECRET:?The XRAY_CLIENT_SECRET secret is missing}"
          : "${TEST_PLAN_KEY:?The XRAY_TEST_PLAN_KEY variable is missing}"

          if ! token=$(jq -n --arg id "$XRAY_CLIENT_ID" --arg secret "$XRAY_CLIENT_SECRET" \
              '{client_id: $id, client_secret: $secret}' \
            | curl -sS --fail-with-body -H "Content-Type: application/json" --data @- \
              "$XRAY_API/authenticate"); then
            echo "::error::Xray authentication failed: $token"
            exit 1
          fi
          token=$(tr -d '"' <<< "$token")
          echo "::add-mask::$token"

          if ! response=$(curl -sS --fail-with-body -H "Authorization: Bearer $token" \
              -H "Content-Type: text/xml" --data-binary @xray-report.xml \
              "$XRAY_API/import/execution/junit?projectKey=HE&testPlanKey=$TEST_PLAN_KEY"); then
            echo "::error::Xray refused the report: $response"
            exit 1
          fi
          execution=$(jq -r '.key' <<< "$response")
          echo "Test Execution $execution in Test Plan $TEST_PLAN_KEY: ${{ steps.report.outputs.tests }} tests" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Explain the skipped import
        if: steps.report.outputs.tests == '0'
        run: echo "::notice::No test is linked to a story yet, so nothing was imported into Xray."
