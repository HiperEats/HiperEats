name: Claude review

# AI-assisted code review (practice AI3): Claude reviews every pull request and posts
# its findings as inline comments. It only comments: it never pushes code or merges.
# A human approval still decides the merge, and the author records in the pull request
# (AI use section) which findings were accepted or rejected.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push to the same pull request cancels the review still in progress.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    runs-on: ubuntu-latest
    # Caps the time (and the subscription usage) of a single review.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Uses the Claude subscription token stored in the repository secret
      # CLAUDE_CODE_OAUTH_TOKEN (created with `claude setup-token`).
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The only tool Claude may use is the one that posts inline review comments.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
