spring.application.name=hipereats-backend

# Database: PostgreSQL. The connection comes from environment variables (set by docker-compose.yml
# from the .env file); the defaults only fit a local PostgreSQL started with "docker compose up db".
# Integration tests ignore these values: Testcontainers provides the connection (@ServiceConnection).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hipereats}
spring.datasource.username=${DB_USER:hipereats}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migrations are named with a timestamp and are developed in parallel branches, so one merged later
# can be older than the last one applied. Without this, Flyway refuses to start on an existing database.
spring.flyway.out-of-order=true

# BR1: estimated range = battery level x full range of the type; required = 2 x distance x margin.
hipereats.rules.range.standard-full-km=25
hipereats.rules.range.long-range-full-km=50
hipereats.rules.range.margin=1.2
