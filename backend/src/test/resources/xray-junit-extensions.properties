# JUnit XML report for Xray (HE-41), written by the listener registered in
# META-INF/services/org.junit.platform.launcher.TestExecutionListener.
# CI imports every file of target/xray into one Test Execution of the Test Plan.

report_directory=target/xray
# Surefire (unit tests) and Failsafe (integration and Cucumber tests) each write a report; the
# timestamp keeps the second from overwriting the first.
add_timestamp_to_report_filename=true
# A test covers the stories of its @Requirement and of its HE-n tags (Cucumber scenarios).
test_metadata_reader=pt.ua.hipereats.xray.StoryTagMetadataReader
