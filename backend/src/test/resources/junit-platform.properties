# Feature files run only through the CucumberIT suite (Failsafe), not a second time when
# Surefire or Failsafe discover the Cucumber engine on their own.
cucumber.junit-platform.discovery.as-root-engine=false

# Test names with the feature and the scenario ("Log in - Each role ... - Example #1.2"), so that
# no two scenarios share a name in the reports. Xray identifies a test by its name (HE-41).
cucumber.junit-platform.naming-strategy=long
